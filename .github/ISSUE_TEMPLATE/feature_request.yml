name: 功能建议
description: 建议新的兼容功能或工作流改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明要解决的问题，不要附带真实书籍或账号信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 文件与安全影响
      description: 是否涉及覆盖、删除、网络访问、数据库写入或新依赖？
    validations:
      required: true
