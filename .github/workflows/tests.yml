name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/cbz-workflow/scripts/jmcomic-download-pack/requirements.txt
      - name: Install pinned download dependencies
        run: python -m pip install -r skills/cbz-workflow/scripts/jmcomic-download-pack/requirements.txt
      - name: Check dependency versions and imports
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python skills/cbz-workflow/scripts/jmcomic-download-pack/check_dependencies.py
      - name: Compile Python files
        run: python -m compileall -q skills tests
      - name: Run offline behavior tests
        run: python -m unittest discover -s tests -v
